name: Cleanup PR Preview Deployment
env:
  CLOUDFLARE_PROJECT: __CLOUDFLARE_PROJECT__

on:
  pull_request:
    types: [closed]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      initialized: ${{ steps.check.outputs.initialized }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          if [[ -f .template-initialized ]]; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .template-initialized marker found; skipping preview cleanup."
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          fi

  cleanup:
    needs: gate
    if: needs.gate.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview deployments for PR branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          deployments=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT/deployments?env=preview" \
            | jq -r ".result[] | select(.deployment_trigger.metadata.branch == \"$PR_BRANCH\") | .id")
          for id in $deployments; do
            echo "Deleting preview deployment $id"
            curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT/deployments/$id?force=true"
          done
