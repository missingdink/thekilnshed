name: Deploy PR Preview to Cloudflare Pages
env:
  URL: __SITE_URL__
  BASE_URL: __SITE_URL__
  BASE_PATH: /
  CLOUDFLARE_PROJECT: __CLOUDFLARE_PROJECT__

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      initialized: ${{ steps.check.outputs.initialized }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          if [[ -f .template-initialized ]]; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .template-initialized marker found; skipping preview deploy."
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26.2.0]
        ruby-version: [4.0.5]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci

      - uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05
        with:
          packages: libvips libvips-tools libheif1 libheif-dev libheif-plugin-aomenc libheif-plugin-libde265
          version: 1.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - run: touch frontend/styles/jit-refresh.css
      - run: npm run build

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://pr-${context.issue.number}.${{ env.CLOUDFLARE_PROJECT }}.pages.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${previewUrl}`
            });
