question: "What are typical turnaround times for kiln rentals or per-square firings?"
answer: "With full kiln rentals, we have the most control with turn around time as they are scheduled in advance. We recommend scheduling full kiln rentals 1-month in advance for the best chance to get your preferred dates. If paying by cubic foot, we load with the studio firings, which generally have a turnaround time of 2 weeks to a month, but are dependent on when we have enough work to fill the kiln."
