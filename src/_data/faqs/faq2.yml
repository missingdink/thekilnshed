question: "What temperatures do you fire to?"
answer: |
  <p>We fire our community bisque firings to cone 04 and our community glaze firings at a medium rate to cone 6 with a 3-minute hold. If the entire kiln is rented, we can support firings at any temperature up to cone 6.</p>
  <p>Alternative firings, such as luster firings, may be approved on a case-by-case basis.</p>