question: "What are your glaze requirements or restrictions?"
answer: |
  <p>We allow the use of both in-house and commercial glazes. Like clay, we ask that you verify with our staff that the commercial glaze you use is for the correct temperature. Our studio glazes are included in all of our general studio access membership tiers.</p>
  <p>For non-members who would like to use our studio glazes, the cost is <b>$25</b> per glazing session.</p>