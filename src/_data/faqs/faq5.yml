question: "What are the firing options and costs? Are there any limits on size or quantity or pieces? "
answer: |
  <p><b>We have two main options for firings:</b></p>
  <p>You can fire work by the cubic foot or by the kiln load. Rentals by the cubic foot are fired to our community firings (cone 04 bisque or cone 6 glaze) and cost $12.50 per cu ft.</p>
  <p>We also offer full kiln rentals in sizes ranging from 3 to 10 cubic feet. Full kiln rentals cost $65-$95 and include loading, unloading, and customizable kiln programming. For large or flat work, it is often more economical to rent the entire kiln.</p>
  <p>Our largest kiln has a stacking space of 27"x 26". If you are unsure how much kiln space you need, please contact our <a href="#">kiln boss</a>, and they can help you determine which kiln option will work best for you.</p>