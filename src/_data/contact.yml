# Contact page copy and form settings. Edit in the CMS under "Contact Page".
# Phone, email and address come from Site Settings.

banner:
  heading: Contact n' shit

intro:
  heading: Get in touch
  body: |-
    Questions about classes, memberships, kiln rentals or anything else? Send us a note and someone from the studio will get back to you.

    Prefer to talk? Give us a call.
  response_time: We usually reply within two business days.

shortcuts:
  heading: Looking for something specific?
  items:
    - text: Class dates and sign-ups
      url: /classes
    - text: Membership options and pricing
      url: /membership
    - text: Kiln rental and firing
      url: /kilns
    - text: Meet the people who run the place
      url: /about

visit:
  heading: Plan your visit

form:
  heading: Send us a message
  submit_label: Send message
  success_message: Thanks! Your message is on its way. We'll get back to you soon.
  # Where submissions go. Leave empty to open a pre-filled email to the
  # studio address in Site Settings instead. Set by the developer.
  endpoint: ""
  topics:
    - label: General question
      slug: general
    - label: Classes & workshops
      slug: classes
    - label: Membership
      slug: membership
    - label: Private studio rental
      slug: private-studio
    - label: Kiln rental or firing
      slug: kilns
    - label: Kiln repair
      slug: kiln-repair
    - label: Private event or group class
      slug: events

newsletter:
  heading: Stay in the loop
  body: Be the first to know about new classes, workshops, firings and studio events. No spam, just clay news.
  button_label: Sign me up
  success_message: You're on the list. Thanks!
  # Where signups go. Leave empty to open a pre-filled email to the studio
  # instead. Set by the developer once the studio picks an email list tool.
  endpoint: ""
